<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PodoChat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #ffffff;
    padding: 30px 24px 10px 24px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    justify-content: center;
    border-bottom: 1px solid #f2f2f2;
  }
  header h1 { 
    font-size: 42px; 
    font-weight: 700; 
    letter-spacing: -1px;
    background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .message {
    max-width: 85%;
    padding: 14px 20px;
    border-radius: 20px;
    font-size: 15px;
    line-height: 1.6;
    word-wrap: break-word;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .message.user {
    align-self: flex-end;
    background: #1a73e8;
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .message.bot {
    align-self: flex-start;
    background: #f1f3f4;
    color: #202124;
    border-bottom-left-radius: 4px;
  }
  .message.bot ul {
    margin-left: 20px;
    padding-left: 5px;
    margin-top: 8px;
    margin-bottom: 8px;
  }
  .message.bot li {
    margin-bottom: 6px;
  }
  .message.error {
    align-self: flex-start;
    background: #fce8e6;
    color: #c5221f;
    border-bottom-left-radius: 4px;
  }
  .input-container {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px 24px 16px;
    background: #fff;
  }
  .input-area {
    background: #fff;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    padding: 2px 8px 2px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: none;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .input-area:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,0.28);
    border-color: rgba(223,225,229,0);
  }
  .input-area input {
    flex: 1;
    padding: 12px 0;
    border: none;
    font-size: 16px;
    outline: none;
    background: transparent;
    color: #202124;
  }
  .input-area button {
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .input-area button:hover:not(:disabled) { background: #1557b0; }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing {
    align-self: flex-start;
    background: #f1f3f4;
    color: #5f6368;
    padding: 14px 20px;
    border-radius: 20px;
    border-bottom-left-radius: 4px;
    font-size: 14px;
    animation: fadeIn 0.2s ease;
  }
  .typing::after { content: "..."; animation: dots 1.2s steps(3, end) infinite; }
  @keyframes dots { 0% { content: "."; } 33% { content: ".."; } 66% { content: "..."; } }
  @media (max-width: 600px) {
    .message { max-width: 90%; }
    header h1 { font-size: 32px; }
    .chat { padding: 16px 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>PodoChat</h1>
</header>
<div class="chat" id="chat"></div>
<div class="input-container">
  <div class="input-area">
    <input type="text" id="input" placeholder="Escribe tu consulta..." autofocus>
    <button id="send" aria-label="Enviar">➤</button>
  </div>
</div>
<script>
const API_URL = "https://onrender.com";
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

function parseBotMarkdown(text) {
  let escaped = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  
  let html = escaped.replace(/\n/g, "<br>");
  
  if (html.includes("* ")) {
    let parts = html.split("<br>");
    let inList = false;
    let newParts = [];
    
    for (let part of parts) {
      if (part.trim().startsWith("* ")) {
        if (!inList) {
          newParts.push("<ul>");
          inList = true;
        }
        let itemContent = part.replace("* ", "").trim();
        newParts.push("<li>" + itemContent + "</li>");
      } else {
        if (inList) {
          newParts.push("</ul>");
          inList = false;
        }
        newParts.push(part);
      }
    }
    if (inList) {
      newParts.push("</ul>");
    }
    html = newParts.join("<br>").replace(/<\/ul><br>/g, "</ul>").replace(/<br><ul>/g, "<ul>");
  }
  return html;
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  if (type === "bot") {
    div.innerHTML = parseBotMarkdown(text);
  } else {
    div.textContent = text;
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing-indicator";
  div.textContent = "PodoChat está analizando tu consulta";
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function setLoading(loading) {
  sendBtn.disabled = loading;
  inputEl.disabled = loading;
  if (loading) inputEl.blur();
  else inputEl.focus();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = "";
  addMessage(text, "user");
  setLoading(true);
  showTyping();

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pregunta: text })
    });
    if (!res.ok) throw new Error("Error " + res.status + ": " + res.statusText);
    const data = await res.json();
    removeTyping();
    addMessage(data.respuesta || "(respuesta vacía)", "bot");
  } catch (err) {
    removeTyping();
    addMessage("Error de conexión: " + err.message, "error");
  } finally {
    setLoading(false);
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
